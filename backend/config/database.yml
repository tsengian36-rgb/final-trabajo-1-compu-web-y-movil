default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "postgres" } %>

development:
  <<: *default
  database: balancefood_development

test:
  <<: *default
  database: balancefood_test

production:
  <<: *default
  database: balancefood_production
  username: balancefood
  password: <%= ENV["BALANCEFOOD_DATABASE_PASSWORD"] %>
  url: <%= ENV["DATABASE_URL"] %>
